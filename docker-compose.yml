version: '3.8'
services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./spx-data:/tmp/spx
    depends_on:
      - php
  php:
    build:
      context: ./php
      dockerfile: php.dockerfile
    volumes:
      - ./src:/var/www/html
      - ./spx-data:/tmp/spx
    environment:
      PHP_FPM_PM_STATUS_PATH: /status
    depends_on:
      - redis

  redis:
    image: redis:alpine

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - "9090:9090"

  alertmanager:
    build:
      context: ./alertmanager
      dockerfile: alertmanager.dockerfile
    ports:
      - "9093:9093"
    env_file:
      - .env

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"

  php-fpm-exporter:
    image: hipages/php-fpm_exporter
    environment:
      PHP_FPM_SCRAPE_URI: "tcp://php:9000/status"
    ports:
      - "9253:9253"

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter
    command:
      - "-nginx.scrape-uri=http://nginx/nginx_status"
    ports:
      - "9113:9113"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: ai-regression-service.dockerfile
    ports:
      - "5200:5200"

  regression-service:
    build:
      context: ./regression-service
      dockerfile: regression-service.dockerfile
    ports:
      - "8090:8090"
    env_file:
      - .env
    depends_on:
      - ai-service
      - redis
      - prometheus
      - alertmanager
      - report-service

  report-service:
    build:
        context: ./report-service
        dockerfile: report-service.dockerfile
    ports:
      - "5100:5000"
    volumes:
      - ./reports:/reports
  
  k6:
    build:
        context: ./k6
        dockerfile: k6.dockerfile
    volumes:
      - ./k6:/scripts
    depends_on:
    - nginx
    env_file:
      - .env
    command: ["/scripts/entrypoint.sh"]
